<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>活動報名</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzUsQFcWW-KCBKvdVQ9rLuWUBwn6vP09KdpN9ltvxJBtlGa1GmdGpxo9lbLqnofTUbG/exec";
    const THANKS_URL = "/thanks";
    const PIXEL_ID = "1059276802371134";
  </script>

  <!-- Meta Pixel（PageView） -->
  <script>
    (function loadPixel(){
      if(!PIXEL_ID) return;
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return; n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n; n.push=n; n.loaded=!0; n.version='2.0';
        n.queue=[]; t=b.createElement(e); t.async=!0;
        t.src=v; s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)
      }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', PIXEL_ID);
      fbq('track', 'PageView');
    })();
  </script>
</head>

<body class="bg-slate-50 text-slate-900">
  <!-- 置頂導覽：立即報名 / 外部連結 -->
<div class="sticky top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-4xl items-center gap-3 px-4 py-3">
    <div class="min-w-0 flex-1 text-sm font-semibold text-slate-900 truncate" id="topTitle">活動報名</div>

    <div class="flex items-center gap-2 shrink-0">
      <a id="topExternalLink"
         href="https://www.ganjingworld.com/zh-TW/playlist/1hof3om2pbb2yaNF1gXobqC1or0p"
         target="_blank" rel="noopener"
         class="inline-flex items-center justify-center rounded-xl border border-slate-300 px-3 py-2 text-xs sm:text-sm font-semibold text-slate-700 hover:bg-slate-50 whitespace-nowrap">
        <span class="sm:hidden">乾淨世界</span>
        <span class="hidden sm:inline">乾淨世界頻道</span>
      </a>

      <a href="#signup"
         class="inline-flex items-center justify-center rounded-xl bg-slate-900 text-white px-3 py-2 text-xs sm:text-sm font-semibold whitespace-nowrap">
        立即報名
      </a>
    </div>
  </div>
</div>

        </a>
        <a href="#signup"
           class="inline-flex rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800">
          立即報名
        </a>
      </div>
    </div>
  </div>
    <div class="mx-auto max-w-4xl px-4 py-8">

    <!-- 訊息公布欄（由 Google Sheet / GAS 動態提供） -->
    <div id="noticeBoard" class="mb-6 hidden"></div>

    <!-- 影片（可選：event.json 若提供 影片嵌入網址/影片URL 才顯示） -->
    <div id="videoCard" class="mb-6 hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">影片</h2>
      <div class="mt-4 aspect-video overflow-hidden rounded-xl ring-1 ring-slate-200">
        <iframe id="videoFrame" class="h-full w-full" src="" title="影片"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </div>

    <div class="mt-4 grid gap-6 md:grid-cols-5">
      <div class="md:col-span-2">
        <div class="overflow-hidden rounded-2xl shadow-sm ring-1 ring-slate-200 bg-white">
          <img src="/assets/poster.jpg" alt="活動海報" class="h-full w-full object-cover" />
        </div>
      </div>

      <div class="md:col-span-3">
        <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
          <h1 id="title" class="text-2xl font-semibold tracking-tight">載入中…</h1>
          <p id="tagline" class="mt-2 text-slate-600"></p>

          <div class="mt-5 grid gap-3 rounded-xl bg-slate-50 p-4 ring-1 ring-slate-200">
            <div class="flex gap-3"><div class="w-16 text-slate-500">日期</div><div class="font-medium" id="date"></div></div>
            <div class="flex gap-3"><div class="w-16 text-slate-500">時間</div><div class="font-medium" id="time"></div></div>
            <div class="flex gap-3"><div class="w-16 text-slate-500">地點</div><div class="font-medium" id="place"></div></div>
            <div class="flex gap-3" id="addrRow"><div class="w-16 text-slate-500">地址</div><div class="font-medium" id="addr"></div></div>
          </div>

          <ul id="notes" class="mt-5 list-disc space-y-2 pl-5 text-slate-700"></ul>
          <div class="mt-4 text-sm text-slate-600" id="contact"></div>
        </div>
      </div>
    </div>

    <div id="signup" class="mt-8 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
      <h2 class="text-lg font-semibold">報名表單</h2>
      <div id="closedMsg" class="mt-4 hidden rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">
        本場次報名已截止或名額已滿，感謝您的關注。
      </div>

      <form id="signupForm" class="mt-6 grid gap-4" method="post" action="">
        <input type="hidden" name="活動代碼" id="event_id" />
        <input type="hidden" name="活動名稱" id="event_name" />
        <input type="hidden" name="成功頁網址" id="thanks_url" />
        <input type="hidden" name="報名序號" id="reg_id" />

        <div class="grid gap-4 md:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium">訂票人姓名（必填）</span>
            <input name="訂票人姓名" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2" />
          </label>

          <label class="block">
            <span class="text-sm font-medium">聯絡電話（必填）</span>
            <input name="聯絡電話" required inputmode="tel" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2" />
            <div class="mt-1 text-xs text-slate-500">活動前 3–5 天會電話核對，通話後才算完成保留。</div>
          </label>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium">票數（每人最多 2 張）（必填）</span>
            <select name="票數" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2">
              <option value="">請選擇</option><option>1</option><option>2</option>
            </select>
          </label>

          <label class="block">
            <span class="text-sm font-medium">LINE 或 Email（擇一，必填）</span>
            <input name="LINE 或 Email" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2" />
          </label>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <label class="block">
            <span class="text-sm font-medium">訊息來源（必填）</span>
            <select name="訊息來源" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2">
              <option value="">請選擇</option>
              <option>Facebook</option><option>Threads</option><option>Instagram</option>
              <option>LINE</option><option>朋友轉傳</option><option>海報／傳單</option><option>其他</option>
            </select>
          </label>

          <label class="block">
            <span class="text-sm font-medium">備註</span>
            <input name="備註" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-2" />
          </label>
        </div>

        <label class="flex items-start gap-3 rounded-xl bg-slate-50 p-4 ring-1 ring-slate-200">
          <input type="checkbox" required class="mt-1 h-4 w-4" />
          <span class="text-sm text-slate-700" id="agreeText">我同意名額有限之規則。</span>
        </label>

        <button id="submitBtn" type="submit"
          class="mt-2 inline-flex w-full items-center justify-center rounded-xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white hover:bg-slate-800">
          送出報名
        </button>
      </form>
    </div>
  </div>

  <script>
    // 產生報名序號：TNN-XXXXXXXX
    function makeRegId() {
      const s = Math.random().toString(16).slice(2, 10).toUpperCase();
      return `TNN-${s}`;
    }

    // 把 UTM / fbclid / referrer 收集成一段字，塞進備註（不需要分網址）
    
    // 把 UTM / fbclid / ref 收集成一段字，塞進備註
    function getTrackingNote() {
      const p = new URLSearchParams(location.search);
      const keys = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid","ref"];
      const parts = [];

      keys.forEach(k => {
        const v = p.get(k);
        if (v) parts.push(`${k}=${v}`);
      });

      // 若網址沒帶 ref 參數，才用瀏覽器 referrer 當作補充
      if (!p.get("ref")) {
        const r = document.referrer || "";
        if (r) parts.push(`ref=${r}`);
      }

      if (parts.length === 0) return "";
      return `【追蹤】${parts.join(";")}`;
    }

    // 來源識別：用網址參數 src=A 或 src=B
    function getSourceTag() {
      const p = new URLSearchParams(location.search);
      const src = (p.get("src") || "").trim();
      if (!src) return "";
      return `【來源】${src}`;
    }

    function buildNoteTail() {
      return [getSourceTag(), getTrackingNote()].filter(Boolean).join(" ");
    }

    // 訊息公布欄（JSONP，避免 CORS 麻煩）
    function renderNotice(data) {
      const box = document.getElementById("noticeBoard");
      if (!box) return;

      if (!data || data.enabled !== true) {
        box.classList.add("hidden");
        box.innerHTML = "";
        return;
      }

      const title = data.title || "最新公告";
      const msg = (data.message || "").toString().replace(/\n/g, "<br>");
      const linkUrl = (data.linkUrl || "").toString().trim();
      const linkText = (data.linkText || "更多資訊").toString().trim();

      box.classList.remove("hidden");
      box.innerHTML = `
        <div class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
          <div class="text-lg font-semibold">${title}</div>
          <div class="mt-2 text-slate-700 leading-relaxed">${msg}</div>
          ${linkUrl ? `<div class="mt-4"><a href="${linkUrl}" target="_blank" rel="noopener" class="inline-flex rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800">${linkText}</a></div>` : ""}
        </div>
      `;
    }

    function loadNotice() {
      const cb = "renderNotice";
      const s = document.createElement("script");
      s.src = `${GAS_WEBAPP_URL}?mode=notice&callback=${cb}&ts=${Date.now()}`;
      s.async = true;
      document.body.appendChild(s);
    }

    async function loadEvent() {
      const res = await fetch('/event.json', { cache: 'no-store' });
      const e = await res.json();

      document.getElementById('title').textContent = e["活動名稱"] || '';
      document.getElementById('tagline').textContent = e["一句話"] || '';
      document.getElementById('date').textContent = e["日期"] || '';
      document.getElementById('time').textContent = e["時間"] || '';
      document.getElementById('place').textContent = e["地點"] || '';

      const addr = e["地址"] || '';
      if (!addr) document.getElementById('addrRow').classList.add('hidden');
      document.getElementById('addr').textContent = addr;

      const notes = document.getElementById('notes');
      notes.innerHTML = '';
      (e["注意事項"] || []).forEach(t => {
        const li = document.createElement('li');
        li.textContent = t;
        notes.appendChild(li);
      });

      const phone = e["聯絡電話"] || '';
      document.getElementById('contact').textContent = phone ? `聯絡電話：${phone}` : '';

      document.getElementById('event_id').value = e["活動代碼"] || '';
      document.getElementById('event_name').value = e["活動名稱"] || '';
      document.getElementById('thanks_url').value = location.origin + THANKS_URL;
      document.getElementById('agreeText').textContent = e["規則同意文"] || '我同意名額有限之規則。';

      // 置頂標題同步活動名稱
      const topTitle = document.getElementById('topTitle');
      if (topTitle && e["活動名稱"]) topTitle.textContent = e["活動名稱"];

      // 影片（可選）：event.json 提供 影片嵌入網址 或 影片URL 才顯示
      const videoUrl = e["影片嵌入網址"] || e["影片URL"] || e["video"] || "";
      if (videoUrl) {
        const card = document.getElementById("videoCard");
        const frame = document.getElementById("videoFrame");
        if (card && frame) {
          frame.src = videoUrl;
          card.classList.remove("hidden");
        }
      }

      // 報名截止（前端 A 方案）：event.json 提供 closeAt 或 截止時間
      const closeAtStr = e["closeAt"] || e["截止時間"] || "";
      if (closeAtStr) {
        const closeAt = new Date(closeAtStr).getTime();
        if (!Number.isNaN(closeAt) && Date.now() >= closeAt) {
          const btn = document.getElementById("submitBtn");
          if (btn) btn.disabled = true;
          const msg = document.getElementById("closedMsg");
          if (msg) msg.classList.remove("hidden");
          // 也順便把表單輸入整體 disable，避免誤填
          const form = document.getElementById("signupForm");
          if (form) {
            form.querySelectorAll("input, select, textarea, button").forEach(el => {
              if (el.id !== "submitBtn") el.disabled = true;
            });
          }
        }
      }
    }

    // ✅ 背景送出，避免手機跳到 script.google.com 被擋；並防重複 + 帶序號 + UTM
    function bindAjaxSubmitOnce() {
      const form = document.getElementById('signupForm');
      if (!form) return;
      if (form.dataset.bound === "1") return;
      form.dataset.bound = "1";

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();

        // 防連點/重複送出
        if (form.dataset.submitting === "1") return;
        form.dataset.submitting = "1";

        const btn = form.querySelector('button[type="submit"]');
        const btnText = btn ? btn.textContent : "";
        if (btn) {
          btn.disabled = true;
          btn.textContent = "送出中…";
        }

        try {
          // 1) 報名序號
          const regInput = document.getElementById("reg_id");
          if (regInput && !regInput.value) regInput.value = makeRegId();
          const rid = regInput ? regInput.value : makeRegId();

          // 2) 來源 + 追蹤塞進備註（不影響觀眾自己寫的）
          const tail = buildNoteTail();
          const noteInput = form.querySelector('input[name="備註"]');
          if (noteInput && tail) {
            const cur = (noteInput.value || "").trim();
            // 避免重覆插入
            const hasSource = cur.includes("【來源】");
            const hasTrack = cur.includes("【追蹤】");
            const needSource = tail.includes("【來源】") && !hasSource;
            const needTrack = tail.includes("【追蹤】") && !hasTrack;

            const addParts = [];
            if (needSource) addParts.push(getSourceTag());
            if (needTrack) addParts.push(getTrackingNote());

            if (addParts.length) {
              const addText = addParts.join(" ");
              noteInput.value = cur ? `${cur} ${addText}` : addText;
            }
          }

          // 3) 背景送到 GAS
          const fd = new FormData(form);
          await fetch(GAS_WEBAPP_URL, {
            method: "POST",
            body: fd,
            mode: "no-cors",
          });

          // 4) 跳感謝頁顯示序號
          location.href = `${THANKS_URL}?rid=${encodeURIComponent(rid)}`;

        } catch (err) {
          alert("送出失敗，請稍後再試一次。");
          if (btn) {
            btn.disabled = false;
            btn.textContent = btnText || "送出報名";
          }
          form.dataset.submitting = "0";
        }
      });
    }

    loadEvent()
      .then(() => { loadNotice(); bindAjaxSubmitOnce(); })
      .catch(console.error);
  </script>
</body>
</html>
