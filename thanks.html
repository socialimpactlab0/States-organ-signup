<!doctype html>
<html lang="zh-Hant">
<head>
 <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-72KV81W5B5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-72KV81W5B5');
  </script>
  
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>報名成功</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-50 text-slate-900">
  <div class="mx-auto max-w-xl px-4 py-16">
    <div class="rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200 text-center">
      <div class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-full bg-emerald-50 ring-1 ring-emerald-200">
        <span class="text-emerald-700 text-xl">✓</span>
      </div>

      <h1 class="text-2xl font-semibold">報名成功</h1>
      <p class="mt-3 text-slate-600">請留意活動前 3–5 天來電確認。</p>

      <!-- 報名序號 -->
      <div id="ridBox" class="mt-5 hidden rounded-xl bg-slate-50 p-4 text-left ring-1 ring-slate-200">
        <div class="text-xs text-slate-500">你的報名序號</div>
        <div class="mt-1 flex items-center justify-between gap-3">
          <div id="ridText" class="font-semibold text-slate-900"></div>
          <button type="button" onclick="copyRid()"
            class="rounded-lg bg-white px-3 py-2 text-xs font-semibold ring-1 ring-slate-300 hover:bg-slate-50">
            複製
          </button>
        </div>
      </div>

      <!-- 來源識別 -->
      <div id="srcBox" class="mt-3 hidden rounded-xl bg-slate-50 p-4 text-left ring-1 ring-slate-200">
        <div class="text-xs text-slate-500">來源</div>
        <div id="srcText" class="mt-1 font-semibold text-slate-900"></div>
      </div>

      <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <a href="./index.html"
           class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800">
          繼續報名
        </a>

        <button type="button"
          onclick="closeOrBlank()"
          class="inline-flex items-center justify-center rounded-xl bg-white px-5 py-3 text-sm font-semibold text-slate-900 ring-1 ring-slate-300 hover:bg-slate-50">
          結束本頁
        </button>
      </div>

      <p class="mt-4 text-xs text-slate-500">
        ※ 若手機不允許直接關閉分頁，可按「結束本頁」後再手動關閉此分頁即可。
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const rid = params.get('rid') || '';
    const src = params.get('src') || '';

    if (rid) {
      document.getElementById('ridBox').classList.remove('hidden');
      document.getElementById('ridText').textContent = rid;
    }

    if (src) {
      const map = { A: 'A（人員推廣）', B: 'B（線上廣告）' };
      document.getElementById('srcBox').classList.remove('hidden');
      document.getElementById('srcText').textContent = map[src] || src;
    }

    function copyRid(){
      if (!rid) return;
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(rid);
        alert("已複製報名序號");
      } else {
        alert("此瀏覽器不支援自動複製，請手動長按複製序號。");
      }
    }

    function closeOrBlank() {
      window.close();
      setTimeout(() => {
        window.location.replace('about:blank');
      }, 250);
    }
  </script>
</body>
</html>
